name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 common apps tests

      - name: Test
        run: python -m pytest -q

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Lint chart
        run: helm lint charts/platform

      - name: Render chart for each environment
        run: |
          helm template platform charts/platform -f charts/platform/values.yaml > /dev/null
          helm template platform charts/platform -f charts/platform/values-dev.yaml > /dev/null
          helm template platform charts/platform -f charts/platform/values-prod.yaml > /dev/null

      - name: Check Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

  images:
    name: Build and scan ${{ matrix.service }}
    needs: [quality, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, orders, users]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Build image
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t local/${{ matrix.service }}:${{ github.sha }} .

      - name: Scan image
        run: trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL local/${{ matrix.service }}:${{ github.sha }}

      - name: Generate SBOM
        run: trivy image --format spdx-json --output sbom-${{ matrix.service }}.json local/${{ matrix.service }}:${{ github.sha }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${{ steps.image.outputs.name }}/${{ matrix.service }}"
          docker tag local/${{ matrix.service }}:${{ github.sha }} "${IMAGE}:sha-${{ github.sha }}"
          docker push "${IMAGE}:sha-${{ github.sha }}"
