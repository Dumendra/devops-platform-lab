services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build:
      context: .
      args:
        SERVICE: orders
    image: devops-platform-orders:local
    environment:
      APP_ENV: local
      APP_VERSION: local
      DATABASE_URL: postgresql://platform:platform@postgres:5432/platform
    ports:
      - "8081:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5

  users:
    build:
      context: .
      args:
        SERVICE: users
    image: devops-platform-users:local
    environment:
      APP_ENV: local
      APP_VERSION: local
    ports:
      - "8082:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    image: devops-platform-gateway:local
    environment:
      APP_ENV: local
      APP_VERSION: local
      ORDERS_URL: http://orders:8000
      USERS_URL: http://users:8000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8000"
    depends_on:
      orders:
        condition: service_healthy
      users:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
