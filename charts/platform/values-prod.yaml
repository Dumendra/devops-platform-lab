global:
  environment: prod

services:
  gateway:
    image: ghcr.io/dumendra/devops-platform-lab/gateway
    tag: REPLACE_WITH_SHA
    replicas: 3
    autoscale: true
  orders:
    image: ghcr.io/dumendra/devops-platform-lab/orders
    tag: REPLACE_WITH_SHA
    replicas: 3
    autoscale: true
  users:
    image: ghcr.io/dumendra/devops-platform-lab/users
    tag: REPLACE_WITH_SHA
    replicas: 3
    autoscale: true

ingress:
  host: platform.example.com
  tls:
    enabled: true
    secretName: platform-tls

postgres:
  password: CHANGE_ME

security:
  networkPolicies: true
  podDisruptionBudgets: true

autoscaling:
  enabled: true
  targetCPU: 70
  minReplicas: 3
  maxReplicas: 9

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
  dashboard:
    enabled: true
