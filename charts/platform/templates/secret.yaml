apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.postgres.password (include "platform.fullname" .) .Values.postgres.database | quote }}
