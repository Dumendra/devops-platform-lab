apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.global.environment | quote }}
  ORDERS_URL: "http://{{ include "platform.fullname" . }}-orders:8000"
  USERS_URL: "http://{{ include "platform.fullname" . }}-users:8000"
  REDIS_URL: "redis://{{ include "platform.fullname" . }}-redis:6379/0"
